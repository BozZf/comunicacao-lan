[package]
name = "comunicacao-lan"
version = "0.1.0"
edition = "2021"
publish = false
description = "Núcleo de sessões de uma lan house com pagamento por tempo"

[workspace]
members = ["crates/server", "crates/station", "crates/transport", "crates/agent", "crates/logon"]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
