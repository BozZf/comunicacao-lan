name: Rust
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test -p comunicacao-lan -p lan-server -p lan-transport -p lan-agent --all-targets
      - run: cargo +stable run --example session_demo
  windows-prototype:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build -p lan-server -p lan-station -p lan-agent
      - name: Test HTTP flow and restart
        shell: pwsh
        run: ./scripts/smoke.ps1
      - name: Test Windows service and local permissions
        shell: pwsh
        run: ./scripts/service-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: lan-windows-prototype
          path: |
            target/debug/lan-server.exe
            target/debug/lan-station.exe
            target/debug/lan-agent.exe
            scripts/demo.ps1
            scripts/install-agent.ps1
            scripts/uninstall-agent.ps1
            docs/windows-agent.md
            README.md
          if-no-files-found: error
