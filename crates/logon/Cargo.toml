[package]
name = "lan-logon"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "lan_logon"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
comunicacao-lan = { path = "../.." }
lan-transport = { path = "../transport" }
serde_json = "1"
hex = "0.4"
zeroize = "1"
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt", "net", "time"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_Marshal", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }
windows-core = "0.62.2"
