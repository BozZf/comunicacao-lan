[package]
name = "lan-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
comunicacao-lan = { path = "../.." }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
tempfile = "3"
